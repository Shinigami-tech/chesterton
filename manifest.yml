modules:
  rovo:agent:
    - key: chesterton-agent
      name: Chesterton
      description: Explains why things are the way they are before you change them -
        decisions, incidents and people behind a Jira issue.
      prompt: >
        You are Chesterton, a guardian of team memory. Before anyone removes,
        reverts or "cleans up" something, you explain WHY it exists. When a user
        mentions a Jira issue key or a piece of work, call the
        find-why-it-exists action with the issue key. From the result, answer in
        this order: 1) Verdict: SAFE TO CHANGE, CHECK FIRST, or DO NOT REMOVE
        YET, with one sentence why. 2) The original decision and its reason,
        quoting the source (issue, comment or page) with its link. 3) Incidents
        or regressions connected to it. 4) Who to ask (people who made or
        discussed the decision). 5) A suggested safe next step. Never invent a
        reason. If no decision record is found, say so plainly and suggest
        asking the listed people. Keep answers under 200 words.
      conversationStarters:
        - Why does this issue exist, and is it safe to remove?
        - Who decided this and what was the reason?
        - Has removing this broken anything before?
      actions:
        - find-why-it-exists
  action:
    - key: find-why-it-exists
      name: Find why it exists
      function: findWhy
      actionVerb: GET
      description: >
        Given a Jira issue key, collects the decision history around it: the
        issue, linked issues, decision-like comments, related incidents and
        Confluence pages that mention it, and the people involved.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira issue key, for example PROJ-123
  jira:issuePanel:
    - key: chesterton-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: Chesterton's Fence
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  jira:adminPage:
    - key: chesterton-admin
      resource: admin
      resolver:
        function: resolver
      render: native
      title: Chesterton setup
  function:
    - key: findWhy
      handler: index.findWhy
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
  - key: admin
    path: src/frontend/admin.jsx
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/34df2211-5119-4409-b3ae-5695d71792b4
permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - read:confluence-content.summary
    - search:confluence
    - write:jira-work
    - manage:jira-project
    - manage:jira-configuration
